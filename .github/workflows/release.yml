name: Release

# Push a tag matching package.json's version (for example v0.1.0) to publish a
# GitHub release that scripts/install.sh installs from.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish GitHub release
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Match the tag to package.json
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build release assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir release
          npm pack --pack-destination release
          mv "release/devosurf-migmate-$VERSION.tgz" "release/migmate-$VERSION.tgz"
          cp scripts/install.sh release/install.sh
          (cd release && sha256sum "migmate-$VERSION.tgz" install.sh > SHA256SUMS)
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          prerelease=
          case "$VERSION" in *-*) prerelease=--prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" release/* --verify-tag --generate-notes \
            --title "Migmate $VERSION" $prerelease
