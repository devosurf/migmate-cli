name: Manual native and live qualification gates

on:
  workflow_dispatch:
    inputs:
      gate:
        description: Native launch needs a present operator; live-route needs prepared tenant access
        type: choice
        required: true
        options: [desktop, live-route]
      cell:
        description: Exact native cell; self-hosted runner must carry this label
        type: choice
        required: true
        options:
          - darwin-x64
          - darwin-arm64
          - linux-x64
          - linux-arm64
          - win32-x64
          - win32-arm64

permissions:
  contents: read

# Configure these environments with required reviewers. Do not run tenant or desktop gates on PRs.
# migmate-desktop runners need an interactive logged-in desktop, an operator, and the native runtime:
# macOS WebKit, Windows WebView2, or Linux WebKitGTK 4.1 + libxdo and a display session.
# migmate-live runners need the operator-prepared config and credential files outside the checkout.
jobs:
  desktop:
    if: inputs.gate == 'desktop'
    name: Manual installed native launch / ${{ inputs.cell }}
    runs-on: [self-hosted, migmate-desktop, "${{ inputs.cell }}"]
    environment: desktop-qualification
    timeout-minutes: 30
    env:
      MIGMATE_EXPECTED_CELL: ${{ inputs.cell }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Confirm native runtime cell
        run: node -e "if (process.platform + '-' + process.arch !== process.env.MIGMATE_EXPECTED_CELL) throw new Error('Wrong native runner cell')"
      - run: npm ci
      - name: Launch the installed native window for operator inspection and closure
        run: npm run check:package -- --desktop
      # Process exit does not attest visual correctness. Record the operator's actual observations
      # separately; neither this launch gate nor hosted CLI CI claims GUI or route qualification.

  live-route:
    if: inputs.gate == 'live-route'
    name: Real tenant route probe / ${{ inputs.cell }}
    runs-on: [self-hosted, migmate-live, "${{ inputs.cell }}"]
    environment: route-qualification
    timeout-minutes: 120
    env:
      MIGMATE_EXPECTED_CELL: ${{ inputs.cell }}
      MIGMATE_QUALIFICATION_CONFIG: ${{ vars.MIGMATE_QUALIFICATION_CONFIG }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Confirm native runtime cell
        run: node -e "if (process.platform + '-' + process.arch !== process.env.MIGMATE_EXPECTED_CELL) throw new Error('Wrong native runner cell')"
      - run: npm ci
      - name: Build and verify the installed artifact before probing a route
        run: npm run check:package
      - name: Prepare evidence output path
        env:
          MIGMATE_QUALIFICATION_OUTPUT: ${{ runner.temp }}/migmate-qualification-${{ github.run_id }}-${{ github.run_attempt }}
        run: node -e "require('node:fs').appendFileSync(process.env.GITHUB_ENV, 'MIGMATE_QUALIFICATION_OUTPUT=' + process.env.MIGMATE_QUALIFICATION_OUTPUT + '\n')"
      - name: Probe the prepared tenant route and write immutable evidence
        run: >-
          node --input-type=module -e "import { spawnSync } from 'node:child_process';
          const config = process.env.MIGMATE_QUALIFICATION_CONFIG;
          if (!config) throw new Error('Protected environment must name an operator-prepared qualification config');
          const result = spawnSync(process.execPath, ['scripts/qualify-route.ts', '--config', config,
          '--output', process.env.MIGMATE_QUALIFICATION_OUTPUT], { stdio: 'inherit' });
          if (result.error) throw result.error;
          process.exit(result.status ?? 1);"
      - name: Preserve generated qualification evidence, never credentials or job state
        uses: actions/upload-artifact@v4
        with:
          name: qualification-${{ inputs.cell }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.MIGMATE_QUALIFICATION_OUTPUT }}
          if-no-files-found: error
          retention-days: 90
